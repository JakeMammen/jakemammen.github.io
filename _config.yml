# -------------------
# Jekyll Config
# --------------------
title: "Jake Mammen, MS"
baseurl: ""                    # Keep empty for root domain jakemammen.github.io
url: "https://jakemammen.github.io"   # Set this for correct absolute URLs
permalink: pretty
markdown: kramdown
highlighter: rouge

# Plugins
plugins:
  - jekyll-environment-variables
  - jekyll-paginate

paginate: 6
paginate_path: "/blog/page/:num"

# Collections
collections_dir: collections
collections:
  projects:
    output: true
    permalink: /:collection/:path/
  posts:
    output: true
    permalink: /blog/:path/

# Pages
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      weight: 999
  - scope:
      path: "images"
    values:
      image: true
  - scope:
      path: "categories"
    values:
      permalink: /category/:basename/
  - scope:
      path: "pages"
    values:
      permalink: /:basename/

# SCSS
sass:
  style: compact

# Excludes
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - netlify.toml

# -------------------
# Theme Config
# --------------------
title: "Jekyll Curate"
category_dir: category

colors:
  # Light mode
  primary_bg: "#0d042b"
  primary_bg_2: "#0d042b"
  primary_bg_3: "#0d042b"
  primary_text: "#fdfcf9"
  base_bg: "#fdfcf9"
  base_bg_2: "#f7f6ed"
  base_bg_3: "#faebd7"
  base_text: "#0d042b"
  base_text_2: "#3b364c"
  logo_text: "#0d042b"
  header_text: "#0d042b"

  # Dark mode
  primary_bg_dark: "#fdfcf9"
  primary_bg_2_dark: "#fdfcf9"
  primary_bg_3_dark: "#fdfcf9"
  primary_text_dark: "#0b0326"
  base_bg_dark: "#0b0326"
  base_bg_2_dark: "#150c32"
  base_bg_3_dark: "#251654"
  base_text_dark: "#f5f5ec"
  base_text_2_dark: "#929eaf"
  logo_text_dark: "#fdfcf9"
  header_text_dark: "#fdfcf9"
  link_color: "#0d042b"
  link_hover_color: "#3b364c"
  accent_color: "#0d042b"
  border_color: "#e5e0d8"
  gray: "#6b7280"
  gray_light: "#9ca3af"
  gray_dark: "#374151"

fonts:
  use_google_fonts: false
  google_fonts_url: "https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,500;9..40,700&family=Fira+Mono&display=swap"
  use_self_hosted_fonts: true # font files must be placed in /assets/fonts folder and the @font-face definitions must be added to /assets/css/fonts.css
  heading: "'DM Sans'"
  base: "'DM Sans'"
  monospace: "'Fira Mono'"
  logo: "'DM Sans'"

logo:
  logo_text: "Jake Mammen, MS"
  logo_image: assets/images/logo/J.png
  logo_image_mobile: assets/images/logo/J.png
  logo_image_invert: assets/images/logo/J.png
  logo_image_invert_mobile: assets/images/logo/J.png
  logo_image_desktop_height: "45px"
  logo_image_desktop_width: "45px"
  logo_image_mobile_height: "45px"
  logo_image_mobile_width: "45px"
  show_logo_image_on_mobile: true
  show_logo_image_on_desktop: true
  show_logo_text_on_mobile: false
  show_logo_text_on_desktop: false

header: 
  fixed: false

open_graph:
  meta_opengraph_type: "website"
  meta_twitter_card: "summary"

darkmode:
  enable_dark_mode: true
  show_dark_mode_toggle_in_header: true
  show_dark_mode_toggle_in_bottom: false
  show_dark_mode_toggle_in_mobile_menu: true

cookie_banner:
  enabled: true
  show_manage_cookies_at_bottom: true

analytics:
  google_analytics_id: "UA-000000-0"

menu: 
  show_dropdown_items_in_mobile_menu: false
  show_social_media_in_mobile_menu: true
  
# Footer customization
footer:
  enable_footer: true
  footer_title: "Jake Mammen, MS"
  footer_description: "Follow or connect via the links below."
  enable_social_media_icons: true
  enable_contact_details: true
  enable_menu_footer_primary: true
  enable_menu_footer_secondary: false
  enable_menu_footer_tertiary: false
  footer_primary_menu_title: "My Projects"
  footer_secondary_menu_title: "Company"
  footer_tertiary_menu_title: "Other"